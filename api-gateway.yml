server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      cors-configurations:
        '[/**]':
          allowedOrigins:
            - "http://localhost:3000"
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          allowedHeaders: "*"
          allowCredentials: true
      routes:
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transactions/**
        - id: block-customer-internal
          uri: forward:/__blocked
          predicates:
            - Path=/api/customers/internal
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # Proxy each service's raw OpenAPI spec, for the aggregated Swagger UI below
        - id: account-service-docs
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/account-service/v3/api-docs
          filters:
            - RewritePath=/account-service/v3/api-docs, /v3/api-docs
        - id: customer-service-docs
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/customer-service/v3/api-docs
          filters:
            - RewritePath=/customer-service/v3/api-docs, /v3/api-docs
        - id: transaction-service-docs
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/transaction-service/v3/api-docs
          filters:
            - RewritePath=/transaction-service/v3/api-docs, /v3/api-docs
        - id: auth-service-docs
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: account-service
        url: /account-service/v3/api-docs
      - name: customer-service
        url: /customer-service/v3/api-docs
      - name: transaction-service
        url: /transaction-service/v3/api-docs
      - name: auth-service
        url: /auth-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"