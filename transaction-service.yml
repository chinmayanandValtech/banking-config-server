server:
  port: 8083

spring:
  datasource:
    username: chinmayanand
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: 1CHN1Bi8R0YYkCN6mrDEcys4HHAK3RJqU/1Alp+B1Xg=
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

  endpoint:
    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      accountService:
        maxAttempts: 3
        waitDuration: 2s
